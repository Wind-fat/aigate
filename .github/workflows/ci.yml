name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: uv sync --all-groups
      - name: Lint
        run: uv run ruff check src tests scripts
      - name: Test
        run: uv run pytest -q
      - name: Smoke (real server, mock provider)
        run: bash scripts/smoke.sh

  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build

  eval-gate:
    runs-on: ubuntu-latest
    env:
      AIGATE_DATABASE_URL: sqlite+aiosqlite:///./ci_eval.db
      AIGATE_RATE_LIMITER: memory
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: uv sync --all-groups
      - name: Seed
        run: |
          uv run python scripts/seed.py
          uv run python evals/bootstrap.py
      - name: Start gateway
        run: |
          uv run uvicorn aigate.main:app --port 8096 --log-level warning &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8096/health > /dev/null; then break; fi
            sleep 0.5
          done
          curl -sf http://127.0.0.1:8096/health
      - name: Eval gate (fails the build on any assertion)
        run: uv run python evals/run.py smoke regression --base-url http://127.0.0.1:8096
