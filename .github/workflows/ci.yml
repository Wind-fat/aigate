name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: uv sync --all-groups
      - name: Lint
        run: uv run ruff check src tests scripts evals
      - name: Test
        run: uv run pytest -q
      - name: Smoke (real server, mock provider)
        run: bash scripts/smoke.sh

  deploy-check:
    # Static validation of the compose stack. There is no Docker on the author's machine,
    # so this job is the only thing standing between "it looks right" and a first
    # `docker compose up` that fails on a missing COPY source.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false
      - name: Install
        run: uv sync --all-groups
      - name: Generate a throwaway env file
        run: |
          cp .env.production.example .env.production
          sed -i "s|REPLACE_ME_openssl_rand_base64_32|$(openssl rand -base64 32)|" .env.production
          sed -i "s|REPLACE_ME_openssl_rand_base64_48|$(openssl rand -base64 48)|" .env.production
          sed -i "s|replace-with-a-long-random-password|$(openssl rand -base64 24)|" .env.production
      - name: Validate compose / Dockerfiles / env
        run: uv run python scripts/check_deploy.py --env-file .env.production

  console:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console/package-lock.json
      - name: Install
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build

  eval-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AIGATE_DATABASE_URL: sqlite+aiosqlite:///./ci_eval.db
      AIGATE_RATE_LIMITER: memory
    steps:
      - uses: actions/checkout@v4
      # No uv cache here on purpose: the post-job cache prune hung for 5 minutes on the
      # runner and failed the job even though every real step had passed. A 60-second
      # install is cheaper than a red build nobody trusts.
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: uv sync --all-groups
      - name: Seed
        run: |
          uv run python scripts/seed.py
          uv run python evals/bootstrap.py
      - name: Start gateway
        run: |
          uv run uvicorn aigate.main:app --port 8096 --log-level warning &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8096/health > /dev/null; then break; fi
            sleep 0.5
          done
          curl -sf http://127.0.0.1:8096/health
      - name: Eval gate (fails the build on any assertion)
        run: uv run python evals/run.py smoke regression --base-url http://127.0.0.1:8096
